id: joseph_aftermath
template: story/joseph_aftermath.html

text_blocks:
  - condition: mira_memory_showed_empathy
    text:
      - "The woman exhales shakily as you kneel beside her. She doesn't pull away."
      - "'My name is Mira,' she says quietly."
      - "You nod as she introduces herself and offer the courtesy of doing the same, speaking quietly back to her."
      - "'And what is his name?' you place a hand on the man's shoulder gently, assessing the curse as it takes its toll on his body. His eyes half-lidded, face blank and mind almost absent. Probably in shock... Perhaps denial? Sorrow, most likely."
      - "'... Joseph...' she says in a quiet and grief-stricken voice."
      - "As you look between them, assessing the state of the arm and the manner in which she is speaking, you understand the loss — what everyone around you is thinking and feeling before they have to spell it out for you."
      - "'How long until...?' you ask her quietly."
      - "'Hours... maybe less. The curse moves fast...' she answers, still keeping her hand in his and not leaving his side."
      - "'I'm sorry... Is there anything I can do?' you ask gently, placing a hesitant hand on her shoulder." 
      - "The gesture small but grounding, offering not only your assistance but your comfort as you follow along to her lead. Having Joseph be comfortable in his last hours is all you can do."
      - "It's something that will never leave your mind. For one thing is to read about a curse... but being face to face with it is a whole different beast."
      - "After Joseph is gone and just another statue in the village's history — one stone face amongst many — Mira finally stands up. You follow her movements."

  - condition: mira_memory_pressed_for_answers
    text:
      - "'He was cursed... It's real,' you whisper to yourself, not expecting such a sight right away as you arrived in the village."
      - "'Is he suffering? How long ago did he—'"
      - "'Do you mind?' she snaps, eyes filled with grief and annoyance as she looks up at you before taking a shaky breath."
      - "'This started at noon,' she says. 'Magic was involved. Happy?'"
      - "She's clearly got bigger worries right now than you and your questions, and her tone is fiery and challenging as she answers. But at the same time, you cannot help yourself from seeking more knowledge on the curse — on how it operates and spreads, on why it's here."
      - "'I'm sorry...' you say quietly, taking a step closer, looking at his stone-turned arm. 'Is there any way to revert it? To help him?'"
      - "'No there—' she snaps, taking another shaky breath, her hands trembling slightly as they hold his. His body laying pliant there, expression blank as shock, loss and sorrow all take over, leaving him to take comfort in her alone and vice versa."
      - "'You can't fight this level of magic,' she says, voice carrying a touch of anger at the situation. "
      - "'My advice? Leave while you can...' she whispers before moving to make him more comfortable for his final hours. The people around us coming to her aid, until he is gone and just another statue in the village's history, one stone face amongst many."

  - condition: mira_memory_invoked_authority
    text:
      - "'We should ride to the Capital, the King can-', you stumble with your words, perplexed at the sight and trying to inch forward to help."
      - "Her expression hardens immediately."
      - "'The King?' she spits. 'He let this happen.'"
      - "Confused, you try to pry into her reaction. After all, what could she have meant?"
      - "The King is a powerful ruler, he's even brought you here, the letter proves it. But upon seeing her face, hard and set on her beliefs, struggling and pained as she holds the man to her, you decide to leave it be."
      - "'Leave. We don't want your kind here.' She cuts off any intent you have, brushing you to the side as the people around you come to her aid."
      - "Feeling like the odd one out and like your presence is only hindering their aid, you step aside. Watching from the sidelines as everyone tends to him, his body pliant, expression blank as shock and sorrow all take over, his eyes already resigned to his fate."
      - "The grief hangs heavy in the air after he is gone and just another statue in the village's history. And you swear you can hear the faintest cry in the distance..."

